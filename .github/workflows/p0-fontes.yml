name: P0 - Validacao de fontes
on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths: ['scripts/p0/**', 'tests/p0/**', '.github/workflows/p0-fontes.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/p0/**', 'tests/p0/**', '.github/workflows/p0-fontes.yml']
  schedule:
    - cron: '0 9 6-9 9 *'
      timezone: Europe/Lisbon
permissions:
  contents: read
concurrency:
  group: p0-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/p0 -v
  gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.window.outputs.run }}
      finish: ${{ steps.window.outputs.finish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: window
        run: python3 scripts/p0/cloud.py gate
  probe:
    needs: [tests, gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Coletar metricas sem textos de materias
        run: python scripts/p0/probe.py
      - name: Comparar amostras anteriores
        run: python scripts/p0/cloud.py compare
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Guardar evidencias mesmo com falha
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p0-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: p0-results/
          retention-days: 7
          if-no-files-found: error
  close:
    needs: [gate, probe]
    if: always() && needs.gate.outputs.finish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Desativar workflow ao final da janela
        run: python3 scripts/p0/cloud.py disable
        env:
          GH_TOKEN: ${{ github.token }}
